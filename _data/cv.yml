    Projects:
      - name: NEGSC Reimplementation and Audit
        summary: >
          Modular public reimplementation and code audit of NEGSC (2024), a
          self-supervised graph-contrastive NIDS method (NEGAT encoder with
          Wasserstein / Gromov-Wasserstein losses) on NF-BoT-IoT-v2 NetFlow data.
          The associated extension work is private and incomplete; no final method
          or result is claimed.
        highlights:
          - "Analysed the paper and reference notebooks; reconstructed the pipeline as modular Python code"
          - "Documented six paper-vs-code discrepancies (dead hyperparameters, untrained per-step edge embedder, ndata key mismatch, and others)"
          - "Public foundation for ongoing private NIDS extension research"
        start_date: 2026-08
        end_date: present
        url: https://github.com/Ilya-Jahed/negsc-fraud-detection

      - name: Anomal-E Analysis and Modular Reimplementation
        summary: >
          Modular implementation and audit of Anomal-E, an edge-centric self-supervised
          GNN method (E-GraphSAGE + DGI) for network anomaly detection on NetFlow data.
        highlights:
          - "Analysed the paper and restructured the implementation into modular components (data pipeline, graph builder, encoder, DGI, detectors, trainer)"
          - "Investigated preprocessing and target-encoding leakage concerns during the audit"
          - "Vectorised graph construction (NetworkX to DGL/NumPy) to eliminate OOM issues on full datasets"
        start_date: 2026-06
        end_date: 2026-08
        url: https://github.com/Ilya-Jahed/Anomal-E-Implementation

      - name: SL-GAD Reimplementation and Study
        summary: >
          Reimplementation of SL-GAD (TKDE 2021), a node-centric self-supervised graph
          anomaly-detection method combining generative attribute regression with
          multi-view contrastive learning.
        highlights:
          - "Implemented the full training and multi-round evaluation pipeline with a CLI"
          - "Single-run AUC of 0.9167 on Cora, within the paper's reported range (not a full reproduction study)"
          - "Studied contrastive/generative ideas relevant to the broader NIDS direction; recognised the node-centric vs flow-level distinction"
        start_date: 2026-07
        end_date: 2026-08
        url: https://github.com/Ilya-Jahed/sl-gad-reimplementation
